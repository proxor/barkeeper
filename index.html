<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Cocktail Pivot Table</title>
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#0d0d18;--bg2:#12121f;--bg3:#181828;--bg4:#1e1e30;
  --border:rgba(255,255,255,.07);--border2:rgba(255,255,255,.13);
  --gold:#c9a84c;--gold-dim:rgba(201,168,76,.14);
  --green:#4fa060;--green-bg:rgba(79,160,96,.17);--green-tx:#7dd890;
  --amber:#c9913a;--amber-bg:rgba(201,145,58,.16);--amber-tx:#e0b060;
  --red:#b84040;--red-bg:rgba(184,64,64,.14);--red-tx:#d88080;
  --blue:#3a8cc9;--blue-bg:rgba(58,140,201,.14);--blue-tx:#80c4e0;
  --text:#ddd8cc;--dim:rgba(221,216,204,.4);--dim2:rgba(221,216,204,.2);
  --rh:36px;
}
*{margin:0;padding:0;box-sizing:border-box;}
body{background:var(--bg);color:var(--text);font-family:'Inter',sans-serif;font-size:12px;height:100vh;display:flex;flex-direction:column;overflow:hidden;}

/* TOP BAR */
.topbar{flex-shrink:0;background:var(--bg2);border-bottom:1px solid var(--border2);padding:9px 14px;display:flex;align-items:center;gap:12px;flex-wrap:wrap;}
.topbar-title{font-family:'Bebas Neue',sans-serif;font-size:17px;letter-spacing:3px;color:var(--gold);}
.topbar-sub{font-size:10px;color:var(--dim);font-weight:300;}

/* LANG SWITCHER */
.lang-sw{display:flex;gap:3px;margin-left:auto;}
.lang-btn{font-family:'Bebas Neue',sans-serif;font-size:11px;letter-spacing:2px;padding:3px 9px;border:1px solid var(--border2);background:transparent;color:var(--dim);cursor:pointer;transition:all .15s;}
.lang-btn:hover{color:var(--text);border-color:rgba(255,255,255,.25);}
.lang-btn.active{background:var(--gold-dim);border-color:var(--gold);color:var(--gold);}

/* LEGEND */
.legend{display:flex;gap:10px;align-items:center;flex-wrap:wrap;}
.leg{display:flex;align-items:center;gap:4px;font-size:10px;color:var(--dim);}
.leg-sq{width:11px;height:11px;border-radius:2px;}
.leg-sq.have{background:var(--green-bg);border:1px solid var(--green);}
.leg-sq.miss{background:var(--red-bg);border:1px solid var(--red);}

/* STATS BAR */
.statsbar{flex-shrink:0;background:var(--bg3);border-bottom:1px solid var(--border);padding:6px 14px;display:flex;align-items:center;gap:14px;flex-wrap:wrap;}
.stat{font-size:11px;color:var(--dim);}
.stat strong{font-weight:600;color:var(--text);}
.stat.s-ready strong{color:var(--green-tx);}
.stat.s-close strong{color:var(--amber-tx);}
.stat.s-owned strong{color:var(--gold);}
.filter-group{margin-left:auto;display:flex;gap:5px;flex-wrap:wrap;}
.fbtn{font-family:'Bebas Neue',sans-serif;font-size:10px;letter-spacing:1.5px;padding:3px 9px;border:1px solid var(--border2);background:transparent;color:var(--dim);cursor:pointer;transition:all .15s;}
.fbtn:hover,.fbtn.active{background:var(--gold-dim);border-color:var(--gold);color:var(--gold);}

/* BUY NEXT PANEL */
.buy-panel{flex-shrink:0;background:var(--bg4);border-bottom:1px solid var(--border);}
.buy-toggle{width:100%;padding:6px 14px;background:none;border:none;color:var(--dim);font-family:'Bebas Neue',sans-serif;font-size:10px;letter-spacing:3px;cursor:pointer;text-align:left;display:flex;align-items:center;gap:8px;}
.buy-toggle:hover{color:var(--gold);}
.buy-content{display:none;padding:8px 14px 10px;overflow-x:auto;}
.buy-content.open{display:block;}
.buy-cards{display:flex;gap:8px;width:max-content;}
.buy-card{background:var(--bg2);border:1px solid var(--border2);padding:10px 12px;min-width:155px;max-width:185px;position:relative;}
.buy-rank{position:absolute;top:5px;right:8px;font-family:'Bebas Neue',sans-serif;font-size:18px;color:var(--dim2);}
.buy-name{font-size:11.5px;font-weight:500;color:var(--text);margin-bottom:5px;padding-right:22px;line-height:1.3;}
.buy-cat{font-family:'Bebas Neue',sans-serif;font-size:8px;letter-spacing:2px;margin-bottom:5px;display:block;}
.buy-unlocks{font-size:10px;color:var(--green-tx);margin-bottom:2px;font-weight:500;}
.buy-close{font-size:10px;color:var(--amber-tx);margin-bottom:3px;}
.buy-names{font-size:9px;color:var(--dim);line-height:1.5;font-style:italic;}
.buy-empty{font-size:11px;color:var(--dim);padding:6px 0;font-style:italic;}


/* ING FILTER BAR */
.ing-bar{flex-shrink:0;background:var(--bg3);border-bottom:1px solid var(--border);padding:5px 14px;display:flex;align-items:center;gap:8px;flex-wrap:wrap;min-height:34px;}
.ing-bar-label{font-family:'Bebas Neue',sans-serif;font-size:10px;letter-spacing:2.5px;color:var(--dim);white-space:nowrap;flex-shrink:0;}
.ing-chips{display:flex;gap:4px;flex-wrap:wrap;align-items:center;flex:1;}
.ing-chip{display:inline-flex;align-items:center;gap:4px;background:rgba(201,168,76,.15);border:1px solid var(--gold);color:var(--gold);font-size:10px;padding:2px 7px;font-family:'Bebas Neue',sans-serif;letter-spacing:1px;}
.ing-chip-x{cursor:pointer;opacity:.6;font-size:12px;line-height:1;transition:opacity .15s;}
.ing-chip-x:hover{opacity:1;}
.ing-hint{font-size:10px;color:var(--dim2);font-style:italic;font-family:'Inter',sans-serif;}
.ing-sel{background:var(--bg4);border:1px solid var(--border2);color:var(--dim);font-size:10px;padding:3px 6px;font-family:'Bebas Neue',sans-serif;letter-spacing:1px;cursor:pointer;outline:none;max-width:180px;}
.ing-sel:hover{border-color:rgba(255,255,255,.25);color:var(--text);}
.ing-clear{font-family:'Bebas Neue',sans-serif;font-size:10px;letter-spacing:1.5px;padding:3px 9px;border:1px solid var(--red);background:var(--red-bg);color:var(--red-tx);cursor:pointer;transition:all .15s;display:none;}
.ing-clear:hover{background:rgba(184,64,64,.25);}

/* TABLE */
.table-wrap{flex:1;overflow:auto;}
table{border-collapse:separate;border-spacing:0;width:max-content;min-width:100%;}
thead tr:first-child th{position:sticky;top:0;z-index:20;background:var(--bg2);}
thead tr:nth-child(2) th{position:sticky;top:67px;z-index:19;background:var(--bg2);}
.col-ing{position:sticky;left:0;z-index:15;background:var(--bg2);min-width:168px;max-width:168px;width:168px;}
thead .col-ing{z-index:25;}
.col-c{min-width:62px;max-width:62px;width:62px;}
th{border-right:1px solid var(--border);border-bottom:1px solid var(--border);vertical-align:bottom;}

.th-ing-wrap{padding:8px 10px;display:flex;flex-direction:column;gap:3px;border-bottom:2px solid var(--gold)!important;}
.th-ing-label{font-family:'Bebas Neue',sans-serif;letter-spacing:2px;font-size:10px;color:var(--gold);}
.ctrl-row{display:flex;gap:4px;}
.mini-btn{font-size:8px;padding:1px 5px;border:1px solid var(--border2);background:transparent;color:var(--dim2);cursor:pointer;transition:all .15s;}
.mini-btn:hover{background:rgba(255,255,255,.04);color:var(--dim);}

.th-c-wrap{padding:5px 4px 7px;text-align:center;display:flex;flex-direction:column;align-items:center;gap:1px;}
.th-method{font-size:13px;}
.th-cname{font-family:'Bebas Neue',sans-serif;font-size:10px;letter-spacing:.8px;color:var(--text);line-height:1.15;text-align:center;white-space:pre-line;}
.th-c-wrap.na .th-cname{color:var(--blue-tx);}
.fb{font-family:'Bebas Neue',sans-serif;font-size:8.5px;letter-spacing:.8px;padding:1px 4px;border-radius:2px;display:inline-block;margin-top:1px;white-space:nowrap;}
.fb-ready{background:var(--green-bg);color:var(--green-tx);border:1px solid rgba(79,160,96,.3);}
.fb-close{background:var(--amber-bg);color:var(--amber-tx);border:1px solid rgba(201,145,58,.3);}
.fb-far{background:var(--red-bg);color:var(--red-tx);border:1px solid rgba(184,64,64,.25);}
.fbar{width:40px;height:2px;background:rgba(255,255,255,.07);border-radius:1px;overflow:hidden;margin-top:1px;}
.ffill{height:100%;border-radius:1px;transition:width .3s,background .3s;}
.th-sum-ing{padding:3px 10px;font-size:9px;color:var(--dim);border-bottom:2px solid rgba(255,255,255,.1)!important;font-style:italic;}
.th-sum-c{padding:3px 3px;text-align:center;border-bottom:2px solid rgba(255,255,255,.1)!important;font-size:9px;color:var(--dim2);}

tbody tr{height:var(--rh);}
.row-cat td{padding:4px 10px;font-family:'Bebas Neue',sans-serif;font-size:8.5px;letter-spacing:4px;background:var(--bg3)!important;border-bottom:1px solid rgba(255,255,255,.04);}
.row-cat td:not(.col-ing){background:var(--bg3)!important;}
.ing-cell{padding:0 8px 0 5px;display:flex;align-items:center;gap:6px;height:var(--rh);}
.ing-cb{width:12px;height:12px;cursor:pointer;accent-color:var(--green);flex-shrink:0;}
.ing-lbl{font-size:11px;font-weight:400;color:var(--text);line-height:1.2;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;cursor:pointer;user-select:none;transition:color .15s;}
.ing-lbl.owned{color:var(--green-tx);}
tbody td{border-bottom:1px solid var(--border);border-right:1px solid var(--border);}
.data-cell{text-align:center;vertical-align:middle;padding:3px 2px;font-size:9.5px;font-weight:500;transition:background .2s;position:relative;}
.data-cell.used-have{background:var(--green-bg);color:var(--green-tx);}
.data-cell.used-miss{background:var(--red-bg);color:var(--red-tx);}
.data-cell.used-miss::after{content:'x';position:absolute;top:1px;right:2px;font-size:6px;opacity:.4;}
.data-cell.na-col.used-have{background:var(--blue-bg);color:var(--blue-tx);}
.data-cell.na-col.used-miss{background:rgba(184,64,64,.12);color:var(--red-tx);}
.data-cell.unused{color:var(--dim2);}
tbody tr:not(.row-cat):hover .col-ing{background:#1a1a2c!important;}
tbody tr:not(.row-cat):hover td{background:rgba(255,255,255,.015);}
tbody tr:not(.row-cat):hover td.used-have{background:rgba(79,160,96,.24);}
tbody tr:not(.row-cat):hover td.used-miss{background:rgba(184,64,64,.2);}
tbody tr:not(.row-cat):hover td.na-col.used-have{background:rgba(58,140,201,.22);}
</style>
</head>
<body>

<div class="topbar">
  <div>
    <div class="topbar-title" id="ui-title"></div>
    <div class="topbar-sub" id="ui-sub"></div>
  </div>
  <div class="legend">
    <div class="leg"><div class="leg-sq have"></div><span id="ui-leg-have"></span></div>
    <div class="leg"><div class="leg-sq miss"></div><span id="ui-leg-miss"></span></div>
    <div class="leg"><span style="color:var(--blue-tx);font-size:13px">&#x1F9C3;</span><span id="ui-leg-na"></span></div>
  </div>
  <div class="lang-sw">
    <button class="lang-btn active" data-l="en">EN</button>
    <button class="lang-btn" data-l="de">DE</button>
    <button class="lang-btn" data-l="ru">RU</button>
  </div>
</div>

<div class="statsbar">
  <div class="stat s-owned"><span id="ui-owned"></span> <strong id="st-own">0</strong></div>
  <div class="stat s-ready"><span id="ui-ready"></span> <strong id="st-rdy">0</strong> <span id="ui-cocktails"></span></div>
  <div class="stat s-close"><span id="ui-away"></span> <strong id="st-cls">0</strong> <span id="ui-cocktails2"></span></div>
  <div class="filter-group">
    <button class="fbtn active" data-f="all" id="fb-all"></button>
    <button class="fbtn" data-f="ready" id="fb-ready"></button>
    <button class="fbtn" data-f="close" id="fb-close"></button>
    <button class="fbtn" data-f="na" id="fb-na"></button>
  </div>
</div>


<div class="ing-bar" id="ing-bar">
  <span class="ing-bar-label" id="ing-bar-label"></span>
  <div class="ing-chips" id="ing-chips"></div>
  <select class="ing-sel" id="ing-sel"></select>
  <button class="ing-clear" id="ing-clear"></button>
</div>

<div class="buy-panel">
  <button class="buy-toggle" id="buy-toggle">
    <span>&#x1F6D2;</span>
    <span id="buy-toggle-txt"></span>
    <span id="buy-arrow" style="transition:transform .2s">&#x25BA;</span>
  </button>
  <div class="buy-content" id="buy-content">
    <div class="buy-cards" id="buy-cards"></div>
  </div>
</div>

<div class="table-wrap">
  <table id="tbl"></table>
</div>

  tequila_sun:{tequila:'50ml',   oj:'100ml',        grenadine:'15ml'},
  caipirinha: {cachaca:'60ml',   lime:'\u00bd Stk', sugar:'2 TL'},
  americano:  {campari:'30ml',   vermouth:'30ml',   soda:'auffüll.'},
  mimosa:     {prosecco:'90ml',   oj:'60ml',     cointreau:'15ml'},
  lemon_drop: {vodka:'45ml',     cointreau:'25ml',lemon:'20ml',    sugar:'15ml'},
  kamikaze:   {vodka:'40ml',     cointreau:'20ml',lime:'20ml'},
  white_lady: {gin:'40ml',       cointreau:'25ml',lemon:'25ml'},
  c_fizz:     {cointreau:'50ml', soda:'120ml',  lime:'15ml'},
  c_basil:    {cointreau:'40ml', lemon:'10ml',  basil:'5 Bl.',   tonic:'100ml'},
    vodka_tonic: {vodka:'45ml',    tonic:'150ml',  lime:'15ml'},
  tequila_ton: {tequila:'45ml',  tonic:'150ml',  lime:'15ml'},
  aperol_ton:  {aperol:'45ml',   tonic:'120ml',  orange:'1 Stk'},
  campari_ton: {campari:'45ml',  tonic:'120ml',  orange:'1 Stk'},
  ton_cubano:  {rum:'45ml',      lime:'½ Stk', mint:'3–4 Bl.', tonic:'120ml'},
  elder_tonic: {elder:'20ml',    tonic:'150ml',  lime:'15ml'},
    cuba_libre:   {rum:'50ml',      cola:'120ml',      lime:'10ml'},
  dark_stormy:  {rum:'60ml',      ginger_beer:'150ml', lime:'15ml'},
  rum_punch:    {rum:'60ml',      oj:'60ml',         pineapple_j:'60ml',   grenadine:'20ml', lime:'15ml'},
  rasp_daiquiri:{rum:'50ml',      lime:'20ml',       raspberry_s:'25ml'},
  rum_sour:     {rum:'60ml',      lemon:'25ml',      sugar:'20ml'},
  hemingway:    {rum:'60ml',      lime:'20ml',       grapefruit_j:'20ml',  sugar:'15ml'},
    v_mojito:   {lime:'25ml',      mint:'8\u201310 Bl.',sugar:'15ml',     soda:'auffüll.'},
  shirley:    {ginger_ale:'150ml',grenadine:'20ml', oj:'30ml'},
  v_pina:     {pineapple_j:'120ml',coconut_c:'60ml'},
  cucumber_c: {cucumber:'4 Sch.',mint:'5 Bl.',      lime:'20ml',        sugar:'15ml', soda:'auffüll.'},
};

// ══════════ STATE ══════════
let owned=new Set(), lang='en', activeFilter='all', buyOpen=false, mustInclude=new Set();

// ══════════ LANG UI ══════════
function applyLangUI(){
  const t=UI[lang];
  document.getElementById('ui-title').innerHTML=t.title;
  document.getElementById('ui-sub').textContent=t.sub;
  document.getElementById('ui-leg-have').textContent=t.legHave;
  document.getElementById('ui-leg-miss').textContent=t.legMiss;
  document.getElementById('ui-leg-na').textContent='\u00a0'+t.legNA;
  document.getElementById('ui-owned').textContent=t.owned;
  document.getElementById('ui-ready').textContent=t.ready;
  document.getElementById('ui-away').textContent=t.away;
  document.getElementById('ui-cocktails').textContent=t.cocktails;
  document.getElementById('ui-cocktails2').textContent=t.cocktails;
  document.getElementById('fb-all').textContent=t.all;
  document.getElementById('fb-ready').textContent=t.fReady;
  document.getElementById('fb-close').textContent=t.fClose;
  document.getElementById('fb-na').textContent=t.fNA;
  const btn=document.getElementById('buy-toggle-txt');
  if(btn) btn.textContent=buyOpen?t.buyHide:t.buyShow;
}

// ══════════ BUILD TABLE ══════════
function buildTable(){
  const tbl=document.getElementById('tbl');
  tbl.innerHTML='';
  const t=UI[lang];
  const thead=document.createElement('thead');

  // Row 1
  const trH=document.createElement('tr');
  const thI=document.createElement('th');
  thI.className='col-ing';
  thI.style.borderBottom='2px solid var(--gold)';
  thI.innerHTML='<div class="th-ing-wrap"><span class="th-ing-label">'+t.ingredient+'</span><div class="ctrl-row"><button class="mini-btn" id="btn-all">'+t.btnAll+'</button><button class="mini-btn" id="btn-none">'+t.btnNone+'</button></div></div>';
  trH.appendChild(thI);

  COCKTAILS.forEach(c=>{
    const th=document.createElement('th');
    th.className='col-c'; th.dataset.cid=c.id; th.title=c.name[lang].replace('\n',' ');
    th.style.borderBottom='2px solid '+(c.type==='na'?'var(--blue)':'var(--gold)');
    th.innerHTML='<div class="th-c-wrap'+(c.type==='na'?' na':'')+'"><span class="th-method">'+c.method+'</span><span class="th-cname">'+c.name[lang]+'</span><span class="fb" id="fb-'+c.id+'">—</span><div class="fbar"><div class="ffill" id="ff-'+c.id+'" style="width:0%"></div></div></div>';
    trH.appendChild(th);
  });
  thead.appendChild(trH);

  // Row 2 sub-header
  const trS=document.createElement('tr');
  const thS=document.createElement('th');
  thS.className='col-ing th-sum-ing'; thS.textContent=t.subRow; trS.appendChild(thS);
  COCKTAILS.forEach(c=>{
    const th=document.createElement('th');
    th.className='col-c th-sum-c'; th.dataset.cid=c.id;
    th.innerHTML='<span id="sum-'+c.id+'"></span>'; trS.appendChild(th);
  });
  thead.appendChild(trS);
  tbl.appendChild(thead);

  // TBODY
  const tbody=document.createElement('tbody');
  CATS.forEach(cat=>{
    const ings=INGS.filter(i=>i.cat===cat.id);
    if(!ings.length) return;
    // cat row
    const trC=document.createElement('tr'); trC.className='row-cat';
    const tdC=document.createElement('td'); tdC.className='col-ing';
    tdC.colSpan=1; tdC.style.color=cat.color; tdC.style.borderLeft='3px solid '+cat.color;
    tdC.textContent=cat.label[lang]; trC.appendChild(tdC);
    COCKTAILS.forEach(()=>{
      const td=document.createElement('td');
      td.style.background='var(--bg3)'; td.style.borderBottom='1px solid rgba(255,255,255,.04)';
      trC.appendChild(td);
    });
    tbody.appendChild(trC);

    ings.forEach(ing=>{
      const tr=document.createElement('tr'); tr.dataset.iid=ing.id;
      const tdI=document.createElement('td'); tdI.className='col-ing';
      tdI.innerHTML='<div class="ing-cell"><input type="checkbox" class="ing-cb" id="cb-'+ing.id+'" data-iid="'+ing.id+'" '+(owned.has(ing.id)?'checked':'')+'><label class="ing-lbl'+(owned.has(ing.id)?' owned':'')+'" for="cb-'+ing.id+'">'+ing.name[lang]+'</label></div>';
      tr.appendChild(tdI);

      COCKTAILS.forEach(c=>{
        const td=document.createElement('td');
        td.className='col-c data-cell'; td.dataset.iid=ing.id; td.dataset.cid=c.id;
        if(c.type==='na') td.dataset.na='1';
        const recipe=RECIPES[c.id]||{};
        const amt=recipe[ing.id];
        if(amt){
          td.textContent=ta(amt);
          const na=c.type==='na'?' na-col':'';
          td.className+=(owned.has(ing.id)?' used-have'+na:' used-miss'+na);
        } else { td.className+=' unused'; }
        tr.appendChild(td);
      });
      tbody.appendChild(tr);
    });
  });
  tbl.appendChild(tbody);

  // Events
  document.getElementById('btn-all').onclick=()=>{INGS.forEach(i=>owned.add(i.id));refresh();};
  document.getElementById('btn-none').onclick=()=>{owned.clear();refresh();};
  document.querySelectorAll('.ing-cb').forEach(cb=>{
    cb.addEventListener('change',e=>{
      const iid=e.target.dataset.iid;
      if(e.target.checked) owned.add(iid); else owned.delete(iid);
      refresh();
    });
  });
  refresh();
}

// ══════════ REFRESH ══════════
function refresh(){
  const t=UI[lang];
  document.querySelectorAll('.ing-cb').forEach(cb=>{
    const iid=cb.dataset.iid; cb.checked=owned.has(iid);
    const lbl=cb.nextElementSibling;
    if(lbl) lbl.className='ing-lbl'+(owned.has(iid)?' owned':'');
  });
  document.querySelectorAll('.data-cell').forEach(td=>{
    const iid=td.dataset.iid,cid=td.dataset.cid;
    const recipe=RECIPES[cid]||{};
    const amt=recipe[iid];
    if(!amt) return;
    const c=COCKTAILS.find(x=>x.id===cid);
    const na=c&&c.type==='na'?' na-col':'';
    td.className='col-c data-cell'+(owned.has(iid)?' used-have'+na:' used-miss'+na);
    td.textContent=ta(amt);
  });

  let rdy=0,cls=0;
  COCKTAILS.forEach(c=>{
    const recipe=RECIPES[c.id]||{};
    const needed=Object.keys(recipe);
    const have=needed.filter(i=>owned.has(i)).length;
    const miss=needed.length-have;
    const pct=needed.length>0?Math.round(have/needed.length*100):0;
    const fb=document.getElementById('fb-'+c.id);
    const ff=document.getElementById('ff-'+c.id);
    const sm=document.getElementById('sum-'+c.id);
    ff.style.width=pct+'%';
    if(miss===0){fb.textContent=t.fbReady;fb.className='fb fb-ready';ff.style.background='var(--green)';if(cocktailPassesIngFilter(c.id))rdy++;}
    else if(miss===1){fb.textContent=t.fb1;fb.className='fb fb-close';ff.style.background='var(--amber)';if(cocktailPassesIngFilter(c.id))cls++;}
    else if(miss<=2){fb.textContent=miss+' '+t.fbN;fb.className='fb fb-close';ff.style.background='var(--amber)';}
    else{fb.textContent=miss+' '+t.fbMiss;fb.className='fb fb-far';ff.style.background='var(--red)';}
    if(sm) sm.textContent=have+'/'+needed.length;
  });

  document.getElementById('st-own').textContent=owned.size;
  document.getElementById('st-rdy').textContent=rdy;
  document.getElementById('st-cls').textContent=cls;
  if(buyOpen) renderBuyNext();
  applyFilter();
}

function cocktailPassesIngFilter(cid){
  if(!mustInclude.size) return true;
  const needed=Object.keys(RECIPES[cid]||{});
  for(const iid of mustInclude) if(!needed.includes(iid)) return false;
  return true;
}

function applyFilter(){
  COCKTAILS.forEach(c=>{
    const recipe=RECIPES[c.id]||{};
    const miss=Object.keys(recipe).filter(i=>!owned.has(i)).length;
    let show=true;
    if(activeFilter==='ready') show=miss===0;
    else if(activeFilter==='close') show=miss<=2;
    else if(activeFilter==='na') show=c.type==='na';
    if(show) show=cocktailPassesIngFilter(c.id);
    document.querySelectorAll('[data-cid="'+c.id+'"]').forEach(el=>el.style.display=show?'':'none');
  });
}

// ══════════ BUY NEXT ══════════
function renderBuyNext(){
  const t=UI[lang];
  const catMap=Object.fromEntries(CATS.map(c=>[c.id,c]));
  const recs=[];
  INGS.forEach(ing=>{
    if(owned.has(ing.id)) return;
    let unlocks=0,close=0;
    const uNames=[],cNames=[];
    COCKTAILS.forEach(c=>{
      if(!cocktailPassesIngFilter(c.id)) return;
      const recipe=RECIPES[c.id]||{};
      const needed=Object.keys(recipe);
      if(!needed.includes(ing.id)) return;
      const miss=needed.filter(i=>!owned.has(i)).length;
      if(miss===1){unlocks++;uNames.push(c.name[lang].replace('\n',' '));}
      else if(miss===2){close++;cNames.push(c.name[lang].replace('\n',' '));}
    });
    if(unlocks>0||close>0) recs.push({ing,unlocks,close,uNames,cNames,score:unlocks*5+close});
  });
  recs.sort((a,b)=>b.score-a.score);
  const top=recs.slice(0,8);
  const container=document.getElementById('buy-cards');
  if(!top.length){
    container.innerHTML='<div class="buy-empty">'+(owned.size===0?t.buyEmpty:t.buyAll)+'</div>';
    return;
  }
  const rankColors=['#c9a84c','#a0a0b0','#c07050','#888','#888','#888','#888','#888'];
  container.innerHTML=top.map((r,i)=>{
    const cat=catMap[r.ing.cat]||{};
    return '<div class="buy-card"><div style="position:absolute;top:0;left:0;width:3px;height:100%;background:'+(cat.color||'#888')+'"></div><div class="buy-rank" style="color:'+rankColors[i]+'">'+(i+1)+'</div><div class="buy-name">'+r.ing.name[lang]+'</div><span class="buy-cat" style="color:'+(cat.color||'#888')+'">'+(cat.label[lang]||'')+'</span>'+(r.unlocks>0?'<div class="buy-unlocks">\uD83D\uDD13 '+t.unlocks+' '+r.unlocks+' '+t.unlocksSfx+'</div><div class="buy-names">'+r.uNames.join(' \u00b7 ')+'</div>':'')+(r.close>0?'<div class="buy-close" style="margin-top:'+(r.unlocks>0?'5':'0')+'px">\u2191 '+t.closerPfx+' '+r.close+' '+t.closerSfx+'</div><div class="buy-names">'+r.cNames.join(' \u00b7 ')+'</div>':'')+'</div>';
  }).join('');
}


// ══════════ ING FILTER ══════════
function initIngFilter(){
  const t=UI[lang];
  const sel=document.getElementById('ing-sel');
  const prev=sel.value;
  sel.innerHTML='<option value="">'+t.ifbAdd+'</option>';
  CATS.forEach(cat=>{
    const grp=document.createElement('optgroup');
    grp.label=cat.label[lang];
    INGS.filter(i=>i.cat===cat.id).forEach(ing=>{
      const opt=document.createElement('option');
      opt.value=ing.id; opt.textContent=ing.name[lang];
      if(mustInclude.has(ing.id)) opt.disabled=true;
      grp.appendChild(opt);
    });
    sel.appendChild(grp);
  });
  sel.value='';
  document.getElementById('ing-bar-label').textContent=t.ifbLabel;
  document.getElementById('ing-clear').textContent=t.ifbClear;
  sel.onchange=e=>{
    const iid=e.target.value; if(!iid) return;
    mustInclude.add(iid); sel.value='';
    renderIngChips(); refresh();
  };
  document.getElementById('ing-clear').onclick=()=>{
    mustInclude.clear(); renderIngChips(); refresh();
  };
}

function renderIngChips(){
  const t=UI[lang];
  const container=document.getElementById('ing-chips');
  const clearBtn=document.getElementById('ing-clear');
  if(!mustInclude.size){
    container.innerHTML='<span class="ing-hint">'+t.ifbHint+'</span>';
    clearBtn.style.display='none';
  } else {
    container.innerHTML=[...mustInclude].map(iid=>{
      const ing=INGS.find(i=>i.id===iid);
      return '<div class="ing-chip">'+(ing?ing.name[lang]:iid)+'<span class="ing-chip-x" data-iid="'+iid+'">×</span></div>';
    }).join('');
    clearBtn.style.display='';
    container.querySelectorAll('.ing-chip-x').forEach(x=>{
      x.onclick=()=>{ mustInclude.delete(x.dataset.iid); renderIngChips(); initIngFilter(); refresh(); };
    });
  }
  // disable already-selected options
  document.querySelectorAll('#ing-sel option').forEach(o=>{ o.disabled=mustInclude.has(o.value); });
}

// ══════════ EVENTS ══════════
document.querySelectorAll('.fbtn').forEach(btn=>{
  btn.addEventListener('click',e=>{
    document.querySelectorAll('.fbtn').forEach(b=>b.classList.remove('active'));
    e.target.classList.add('active');
    activeFilter=e.target.dataset.f;
    applyFilter();
  });
});

document.getElementById('buy-toggle').addEventListener('click',()=>{
  buyOpen=!buyOpen;
  document.getElementById('buy-content').classList.toggle('open',buyOpen);
  document.getElementById('buy-arrow').style.transform=buyOpen?'rotate(90deg)':'rotate(0deg)';
  document.getElementById('buy-toggle-txt').textContent=buyOpen?UI[lang].buyHide:UI[lang].buyShow;
  if(buyOpen) renderBuyNext();
});

document.querySelectorAll('.lang-btn').forEach(btn=>{
  btn.addEventListener('click',e=>{
    document.querySelectorAll('.lang-btn').forEach(b=>b.classList.remove('active'));
    e.target.classList.add('active');
    lang=e.target.dataset.l;
    applyLangUI();
    buildTable();
    initIngFilter();
    renderIngChips();
  });
});

// ══════════ INIT ══════════
applyLangUI();
buildTable();
initIngFilter();
renderIngChips();
</script>
